name: 'Generate Changelog'
description: 'Generate changelog from conventional commits between tags'
branding:
  icon: 'file-text'
  color: 'blue'
inputs:
  tag:
    description: 'Target tag'
    required: true
  output_file:
    description: 'Path to write changelog file (relative to workspace). Leading/trailing whitespace will be trimmed.'
    required: false
outputs:
  changelog:
    description: 'Generated changelog'
    value: ${{ steps.generate.outputs.changelog }}
runs:
  using: 'node20'
  main: 'dist/index.js'
